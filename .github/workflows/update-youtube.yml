name: Update YouTube RSS
on:
  schedule:
    - cron: '23 20 * * *' # 05:23 JST; GitHub may delay scheduled runs.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run sync:youtube
      - name: Detect video changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/youtube.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - run: npm run verify
        if: steps.changes.outputs.changed == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.changes.outputs.changed == 'true'
      - run: npm run test:browser
        if: steps.changes.outputs.changed == 'true'
      - name: Save validated video data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/youtube.json
          git commit -m "Update YouTube videos from RSS"
          git push origin HEAD:main
      # GITHUB_TOKEN pushes do not trigger push workflows. Explicitly dispatch
      # deployment, also recovering a previous failed dispatch/deployment.
      - name: Request deployment if main is not yet deployed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          last_deployed=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          current=$(git rev-parse HEAD)
          if [ "$current" != "$last_deployed" ]; then
            gh workflow run deploy.yml --ref main
          fi
