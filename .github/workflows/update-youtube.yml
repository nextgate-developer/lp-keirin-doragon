name: Update YouTube RSS
on:
  schedule:
    - cron: '23 2,8,14,20 * * *' # 05:23 / 11:23 / 17:23 / 23:23 JST; delays possible.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || 'youtube-rss-investigation' }}
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/investigation/youtube-rss'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Fetch YouTube RSS with retries
        id: rss
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:youtube -- --managed
        # 1 minute backoff + 2 rounds × 2 sources × 15 seconds = 2 minutes,
        # plus durable health-state reads/writes via GitHub.
        timeout-minutes: 5
      - name: Save exact failed RSS HTTP responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-http-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/youtube-http/
          if-no-files-found: ignore
          retention-days: 7
      - name: Notify only after 24 hours without RSS success, at most once per 24 hours
        if: steps.rss.outputs.notify == 'true'
        run: |
          echo '::error::YouTube RSS has not been fetched successfully for at least 24 hours. Existing videos are retained. See the fetch status summary and HTTP artifacts.'
          exit 1
      - name: Detect video changes
        if: github.ref == 'refs/heads/main' && steps.rss.outputs.available == 'true'
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/youtube.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - run: npm run verify
        if: steps.changes.outputs.changed == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.changes.outputs.changed == 'true'
      - run: npm run test:browser
        if: steps.changes.outputs.changed == 'true'
      - name: Save validated video data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/youtube.json
          git commit -m "Update YouTube videos from RSS"
          git push origin HEAD:main
      # GITHUB_TOKEN pushes do not trigger push workflows. Explicitly dispatch
      # deployment, also recovering a previous failed dispatch/deployment.
      - name: Request deployment if main is not yet deployed
        if: github.ref == 'refs/heads/main' && steps.rss.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          last_deployed=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          current=$(git rev-parse HEAD)
          if [ "$current" != "$last_deployed" ]; then
            gh workflow run deploy.yml --ref main
          fi
