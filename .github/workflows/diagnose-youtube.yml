name: Diagnose YouTube RSS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/diagnose-youtube.mjs
      - name: Save HTTP response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-http-diagnostic-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/youtube-http/
          if-no-files-found: warn
          retention-days: 7
